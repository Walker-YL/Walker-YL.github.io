# Butterfly Theme Configuration
# Docs: https://butterfly.js.org/
# GitHub: https://github.com/jerryc127/hexo-theme-butterfly

# Navigation
menu:
  首页: / || fa-solid fa-home
  关于我: /about/ || fa-regular fa-user
  管理思考: /categories/管理思考/ || fa-solid fa-lightbulb
  技术分享: /categories/技术分享/ || fa-solid fa-laptop-code
  人生随笔: /categories/人生随笔/ || fa-solid fa-pen-fancy
  内容归档: /archives/ || fa-solid fa-archive
  联系我: /contact/ || fa-regular fa-envelope

# Hero Section (Home Page)
index_page:
  brand: 杨璐 Richard | 供应链管理
  slogan: 用技术提效，用文字记录管理与人生
  avatar: /img/avatar.jpg
  introduce: 20年供应链管理老兵，从一线到管理层，深耕供应链优化、团队管理与行业洞察；技术爱好者，终身学习者，在这里分享管理、技术与人生感悟。
  features:
    - name: 管理思考
      icon: fa-solid fa-lightbulb
      desc: 供应链优化、团队管理、行业洞察
      link: /categories/管理思考/
    - name: 技术分享
      icon: fa-solid fa-laptop-code
      desc: 效率工具、编程技术、数字化转型
      link: /categories/技术分享/
    - name: 人生随笔
      icon: fa-solid fa-pen-fancy
      desc: 职业成长、生活感悟、读书笔记
      link: /categories/人生随笔/

# Global Avatar
avatar:
  img: /img/Avatar.jpg
  effect: true

# Social Links
social:
  GitHub: https://github.com/Walker-YL || fa-brands fa-github
  E-mail: mailto:walker-yl@example.com || fa-solid fa-envelope

# Sidebar
aside:
  enable: true
  position: right
  card_author:
    enable: true
    avatar: /img/Avatar.jpg
    name: 杨璐
    description: 20年供应链管理老兵，技术爱好者，终身学习者
  card_announcement:
    enable: true
    content: 欢迎来到我的博客！在这里分享管理思考、技术心得和人生感悟。
  card_tags:
    enable: true
    limit: 40
  card_categories:
    enable: true
    limit: 8
  card_archives:
    enable: true
    type: monthly
    format: YYYY-MM
    depth: 3
    limit: 5
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: false

# Scroll
scroll: true

# Footer
footer:
  owner:
    enable: true
    since: 2025
  copyright: true

# Main layout
index_top_img_height: 80
# page default layout

# Beautify
beautify:
  enable: true
  field: post # site/post
  title-prefix-icon: #f00
  title-prefix-icon-color: "'#FFF'"

# Theme color
theme_color:
  enable: true
  main: "#1a365d"
  main_dark: "#1a365d"
  secondary: "#e67e22"
  secondary_dark: "#e67e22"
  text_slogan: "'rgba(255,255,255,0.8)'"
  link_color: '#ffffff'
  link_color_dark: '#a4d2fa'
  bio_color: "'rgba(255,255,255,0.7)'"
  watermark_color: "'#76bdb9'"

# Dark mode
darkmode:
  enable: true
  # Automatically toggle between dark and light modes
  #真的有这个需求才打开，默认关闭
  autoChangeMode: true

# Font
font:
  enable: true
  font-family: "'Georgia', 'Source Han Serif CN', 'Noto Serif SC', serif"
  code-font: "'Roboto Mono', 'Fira Code', Consolas, Inconsolata, monospace"

# Card borders
card_border: true
card_radius: 12px

# Code
highlight_theme: true
highlight_copy: true
highlight_lang: true
highlight_shrink: false

# Ribbon
#真的有这个需求才打开，默认关闭
# ribbon:
#   enable: true
#   display: [firstpage, post, page]
#   opacity: 0.5
#   colors: ["linear-gradient(135deg, #667eea 0%, #764ba2 100%)", "linear-gradient(135deg, rgba(17, 142, 70, 0.8) 0%, rgba(14, 93, 121, 0.8) 100%)"]

# Post
toc:
  enable: true
  heading: h1, h2, h3, h4, h5, h6
  list_number: true
  maxdepth: 3

# Read more button
readmore_btn: true

# article patent
#真正的文章页面的样式，有三种样式可选
post_ui: true

# Article sharing
#是否启用文章分享功能
sharejs: true

# Share - AddThis
#AddThis share
addThis:
  enable: false

# Comments
comments:
  use: # gitalk | utterances | valine |/disqus | livere
  text: true
  lazyload: false
  count: false

# Gitalk
#see https://github.com/gitalk/gitalk
gitalk:
  enable: false
  github_id: ''
  repo: ''
  client_id: ''
  client_secret: ''
  admin_user: ''
  distraction_free_mode: true

# Utterances
#see https://utteranc.es
utterances:
  enable: false
  repo: ''
  issue_term: pathname
  label: ''
  theme: photon
  crossorigin: anonymous

# Valine
#see https://github.com/NaiveWang/hexo-valine-admin
valine:
  enable: false
  appId: ''
  appKey: ''
  placeholder: Give me a reason to stay ~
  pageSize: 10
  visitor: true
  recordip: true
  enableQQ: true
  meta: ['nick', 'mail', 'link']
  requiredFields: ['nick']
  bg: "'/img/comment_bg.jpg'"

# Disqus
disqus:
  enable: false
  shortname: ''
  apikey: ''

# LiveRe
livedoor:
  enable: false
  uid: ''

# Search
algolia_search:
  enable: false
  hits:
    per_page: 6
  labels:
    input_placeholder: Search for Posts
    hits_empty: "We didn't find any results for the search: ${query}"
    hits_stats: "${hits} results found in ${time} ms"

local_search:
  enable: true
  labels:
    input_placeholder: 搜索文章
    hits_empty: "找不到你想要的 ${query}"
    hits_stats: "${hits} 个结果，用时 ${time} ms"

# Math
mathjax: true
katex: false

# mermaid
#真的有这个需求才打开，默认关闭
mermaid:
  enable: false
  # built-in or guest
  theme:
    light: default
    dark: dark

# Watermark
#真的有这个需求才打开，默认关闭
watermark:
  enable: false
  content: "'walker-yl.github.io'"
  size: 18
  color: "'#76bdb9'"
  opacity: 0.3
  margin: 15

# Lightbox
fancybox: true

# Tag Plugins
note:
  enable: true
  background: true
  border: true
  icon: true
  elevate: true
  list:
    - tag: p
      class: primary
      icon: bell
    - tag: p
      class: info
      icon: info-circle
    - tag: p
      class: success
      icon: check-circle
    - tag: p
      class: warning
      icon: exclamation-triangle
    - tag: p
      class: danger
      icon: times-circle
    - tag: p
      class: default
      icon: leaf

# related_post
related_post:
  enable: true
  status: true
  date_type: created
  limit: 5
  id: false

# Post Edit
#需要在博客的source文件夹下创建editfolder仓库
#最好填写完整链接
post_edit:
  enable: false
  url: https://github.com/username/repo-name/edit/source/

# Reading progress bar
#need to open post_ui first
reading_progress:
  enable: true
  color: "'#e67e22'"
  height: '3px'

# WordCount
#need to open post_ui first
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  text_count: true

# Music
#音乐播放
music:
  enable: false
  id: 7817267022
  server: netease
  type: song
  auto: null
  mutex: true
  limit: 99999
  unlimit: false
  listmaxheight: 340px
  preload: none
  theme: "'#335eea'"
  mode: circulation
  listfolding: true
  storageName: hexo-musicbox

# 404 page
#need to close the `post_ui` first
#404页面
#需要在根目录的source文件下创建404.md
#最好使用本地图片
error_404:
  enable: false
  bg: "/img/404_bg.jpg"
  title: "'页面没有找到'"
  subtitle: "'请检查链接是否正确，或搜索其他内容'"

# Verification
verification:
  site_verification:
  google: ''
  baidu: ''

# ad
google_adsense:
  enable: false
  auto_ads: true
  js: 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js'
  js_client: 'ca-pub-xxxx'
  enable_page_level_ads: true
  first_paragraph_ads: false

# Web Analytics
google_analytics: ''
baidu_analytics: ''

# RSS
feed:
  enable: false
  type: atom
  path: atom.xml
  limit: 20
  hub: ''
  content: ''
  content_limit: 140
  content_limit_delim: ''
  order_by: -date
  tag_dir: tags
  category_dir: categories
  file_name: atom.xml
  autodiscovery: true
  template:

# Sitemap
sitemap:
  enable: false
  path: sitemap.xml

# Github-card
github-card:
  enable: false

# Shortcode and escape
#有以下三个破解版地图，不想用可以删掉
maplinks:
  enable: false
  amap_key: ''
  amap_uiKey: ''

# NoticeOutdate
noticeOutdate:
  enable: true
  style: flat
  limit_day: 365
  position: top
  message_prev: It has been
  message_next: days since the last update, the content of the article may be outdated.

# Copy Settings
copy:
  enable: true
  license: "'CC BY-NC-SA 4.0'"

# timeago
#文章时间显示为多久之前
timeago:
  enable: false
  post_gallery: true

# Flickr
flickr:
  enable: false

# Aplayer
#需要在文章中插入<!--more-->
aplayer:
  enable: false
  autoplay: true
  volume: 0.7
  mini: false
  meting: true
  fixed: false
  loop: all
  order: random
  preload: auto
  theme: "'#335eea'"
  songs:
    - title: 光年之外
      author: G.E.M. 邓紫棋
      url: https://service-5u8j5wdr1252708-1253444277.tcloudbaseapp.com/resume-mp3/1.mp3
      pic: https://p2.music.126.net/1qsutch6w1kM2NIXu9eXRA==/109951164404877751.jpg

# Footer Settings
# --------------------------------------
# 1.  ICP备案信息
#    展示在站点Footer的ICP备案信息
beian:
  enable: false
  icp: ''

# Creative Commons
# 展示在站点Footer的Creative Commons信息
creative_commons:
  enable: false
  license: CC BY-NC-SA 4.0
  icon: by-nc-sa
  permalink: https://creativecommons.org/licenses/by-nc-sa/4.0/

# Site uptime
uptime:
  enable: false
  method: 1
  start: '2020-01-01'
  Chinese: false
