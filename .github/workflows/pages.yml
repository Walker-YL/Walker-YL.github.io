name: Deploy Hexo Blog

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install hexo-deployer-git

      - name: Build Hexo site
        run: |
          npx hexo clean
          npx hexo generate

      - name: Deploy to GitHub Pages
        run: |
          npx hexo deploy
        env:
          GIT_USER: ${{ github.actor }}
          GIT_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_REPO: github.com/${{ github.repository }}.git
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_BRANCH: master

  preview:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install hexo-deployer-git

      - name: Build and Preview
        run: |
          npx hexo clean
          npx hexo generate
        env:
          NODE_ENV: preview

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: public
          retention-days: 7
